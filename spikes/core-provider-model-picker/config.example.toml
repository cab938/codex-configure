# Copy this file to the dedicated CODEX_HOME/config.toml before running the
# canary. The `openai` provider is built in; do not redefine it here.
model = "openai::gpt-5.6-sol"
approval_policy = "never"
sandbox_mode = "read-only"

[model_providers.umich-toolkit]
name = "U-M GPT Toolkit - OpenAI / Azure"
base_url = "https://api.portkey.ai/v1"
wire_api = "responses"
requires_openai_auth = false
env_http_headers = { "x-portkey-api-key" = "UMICH_TOOLKIT_API_KEY" }
