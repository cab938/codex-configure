[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-configure"
version = "0.1.0"
description = "Switch stock Codex clients between OpenAI and U-M GPT Toolkit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["tomlkit>=0.13,<1"]

[project.scripts]
codex-configure = "codex_configure.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
