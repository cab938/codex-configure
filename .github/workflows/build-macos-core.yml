name: Build macOS Dynamic Core

on:
  workflow_dispatch:
  push:
    branches:
      - codex/macos-core-ci
    paths:
      - .github/workflows/build-macos-core.yml
      - scripts/package_core_release.py
      - src/codex-configure/patcher.py
      - src/core-provider-model-picker/**

concurrency:
  group: macos-dynamic-core-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  macos-arm64:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read pinned build metadata
        id: metadata
        run: |
          python - <<'PY'
          import ast
          import os
          import re
          from pathlib import Path

          init_tree = ast.parse(Path("src/codex-configure/__init__.py").read_text())
          package_version = next(
              ast.literal_eval(node.value)
              for node in init_tree.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)
          )

          pin = {}
          for line in Path("src/core-provider-model-picker/upstream-pin.env").read_text().splitlines():
              if "=" not in line or line.lstrip().startswith("#"):
                  continue
              key, value = line.split("=", 1)
              pin[key.strip()] = ast.literal_eval(value.strip())
          commit = pin.get("UPSTREAM_COMMIT", "")
          rust_version = pin.get("MINIMUM_RUST_VERSION", "")
          if not re.fullmatch(r"[0-9a-f]{40}", commit):
              raise SystemExit("invalid UPSTREAM_COMMIT")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", rust_version):
              raise SystemExit("invalid MINIMUM_RUST_VERSION")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"package_version={package_version}\n")
              output.write(f"upstream_commit={commit}\n")
              output.write(f"rust_version={rust_version}\n")
          PY

      - name: Verify Apple Silicon runner
        run: |
          test "$(uname -m)" = "arm64"
          sw_vers
          df -h

      - name: Install pinned Rust toolchain
        env:
          RUST_VERSION: ${{ steps.metadata.outputs.rust_version }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_VERSION" >> "$GITHUB_ENV"
          rustc -vV

      - name: Install codex-configure
        run: python -m pip install .

      - name: Build patched Core
        env:
          CORE_WORKTREE: ${{ runner.temp }}/codex-core
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from codex_configure.patcher import CodexPatcher

          result = CodexPatcher().patch(Path(os.environ["CORE_WORKTREE"]))
          print(result.binary_path)
          print(result.code_mode_host_path)
          PY

      - name: Check native executables
        run: |
          release_dir="$RUNNER_TEMP/codex-core/codex-rs/target/release"
          "$release_dir/codex" --version
          "$release_dir/codex-code-mode-host" --help
          file "$release_dir/codex" "$release_dir/codex-code-mode-host"
          test "$(lipo -archs "$release_dir/codex")" = "arm64"
          test "$(lipo -archs "$release_dir/codex-code-mode-host")" = "arm64"
          otool -L "$release_dir/codex"
          otool -L "$release_dir/codex-code-mode-host"
          du -sh "$RUNNER_TEMP/codex-core"
          df -h

      - name: Package test artifact
        env:
          PACKAGE_VERSION: ${{ steps.metadata.outputs.package_version }}
          UPSTREAM_COMMIT: ${{ steps.metadata.outputs.upstream_commit }}
        run: |
          python scripts/package_core_release.py \
            --release-dir "$RUNNER_TEMP/codex-core/codex-rs/target/release" \
            --output-dir dist \
            --version "$PACKAGE_VERSION" \
            --target macos-arm64 \
            --upstream-commit "$UPSTREAM_COMMIT" \
            --patch-file src/core-provider-model-picker/codex-provider-model-picker.patch \
            --license-file LICENSE \
            --notice-file NOTICE

      - name: Store macOS test artifact
        uses: actions/upload-artifact@v6
        with:
          name: dynamic-core-${{ steps.metadata.outputs.package_version }}-macos-arm64
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
