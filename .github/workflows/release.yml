name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import email
          import glob
          import os
          import zipfile

          wheels = glob.glob("dist/*.whl")
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {len(wheels)}")
          with zipfile.ZipFile(wheels[0]) as archive:
              members = [name for name in archive.namelist() if name.endswith(".dist-info/METADATA")]
              if len(members) != 1:
                  raise SystemExit(f"expected one METADATA file, found {len(members)}")
              metadata = email.message_from_bytes(archive.read(members[0]))
          expected = f"v{metadata['Version']}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"release tag {actual!r} must be {expected!r}")
          PY
      - name: Verify Dynamic Core release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=${RELEASE_TAG#v}
          mkdir core-assets
          for target in linux-x86_64 macos-arm64; do
            asset="codex-configure-core-${version}-${target}.tar.gz"
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$asset" \
              --pattern "$asset.sha256" \
              --dir core-assets
          done
          cd core-assets
          for target in linux-x86_64 macos-arm64; do
            asset="codex-configure-core-${version}-${target}.tar.gz"
            test -f "$asset"
            test -f "$asset.sha256"
            sha256sum --check "$asset.sha256"
          done
      - name: Store distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish distribution
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/codex-configure
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
